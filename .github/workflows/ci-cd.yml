name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_windows_runtime:
        description: Build the optional large Windows native runtime bundle
        required: false
        default: false
        type: boolean
      api_base_url:
        description: Public HTTPS backend origin for Cloudflare Pages (no /api suffix)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (19 services plus common library)
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: socialapp-ci
      RUN_NATIVE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install and start native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'socialapp-ci'"
          sudo -u postgres createdb group_db
          sudo -u postgres createdb auth_bootstrap_test

      - name: Build and run tests
        run: mvn -B clean install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject tracked credential files and literal credential URLs
        run: python infra/audit/check_repository.py

      - name: Test native auto deploy discovery and rollback
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m unittest discover -s infra/azure/tests -v

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          retention-days: 14

  frontend-check:
    name: Analyze, test and build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Verify frontend
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build web --release

  no-docker-runtime:
    name: Build no-Docker Windows runtime bundle
    needs: [build-and-test, frontend-check]
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Build executable Spring Boot JARs
        run: mvn -B clean package -DskipTests

      - name: Build Flutter Web
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release

      - name: Assemble and checksum runtime bundle
        shell: pwsh
        run: ./infra/no-docker/scripts/Build-RuntimeBundle.ps1 -SkipBackendBuild -SkipFrontendBuild

      - name: Upload no-Docker runtime
        uses: actions/upload-artifact@v4
        with:
          name: social-media-no-docker-${{ github.sha }}
          path: dist/no-docker-runtime
          retention-days: 1

  cloudflare-pages:
    name: Deploy Flutter Web to Cloudflare Pages
    needs: [build-and-test, frontend-check]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'doan1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate backend origin and deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          let url;
          try { url = new URL(process.env.API_BASE_URL); }
          catch { throw new Error('Set API_BASE_URL to the real public HTTPS backend origin.'); }
          if (url.protocol !== 'https:' || url.username || url.password ||
              url.pathname !== '/' || url.search || url.hash ||
              ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
            throw new Error('API_BASE_URL must be a public HTTPS origin without credentials, path or query.');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub settings.');
          }
          NODE

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Build Flutter for the public backend
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --dart-define="API_BASE_URL=${API_BASE_URL%/}"
          cp ../infra/cloudflare/_headers build/web/_headers

      - name: Publish Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages deploy frontend/build/web --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
