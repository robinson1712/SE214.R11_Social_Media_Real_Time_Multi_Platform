name: CI/CD

on:
  push:
    branches: [main, codex/ui-backend-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_windows_runtime:
        description: Build the optional large Windows native runtime bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs-ui:
    name: Test and build native Next.js UI
    runs-on: ubuntu-latest
    env:
      # Local fixture only: this build is a test artifact, never a production release.
      GATEWAY_UPSTREAM: http://127.0.0.1:3399
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install UI dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Check native runner, lint, unit contracts and types
        run: |
          node --test ../infra/no-docker/nextjs/run.test.mjs
          npm run lint
          npm run test:unit
          npm run typecheck

      - name: Build production Next runtime with Webpack
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test browser integration with local HTTP and STOMP fixture
        run: |
          python -m pip install --disable-pip-version-check websockets==15.0.1
          export CHROME_PATH="$(command -v google-chrome)"
          test -n "$CHROME_PATH" || { echo "Google Chrome is required for fixture browser checks"; exit 1; }
          python tests/run_connected.py

      - name: Upload fixture check results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: nextjs-fixture-results
          path: |
            frontend-web/tests/connected_results.json
            frontend-web/screenshots/connected_FAIL_*.png
          if-no-files-found: ignore
          retention-days: 14

  build-and-test:
    name: Build and test (19 services plus common library)
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: socialapp-ci
      RUN_NATIVE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install and start native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'socialapp-ci'"
          sudo -u postgres createdb group_db
          sudo -u postgres createdb auth_bootstrap_test

      - name: Build and run tests
        run: mvn -B clean install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test native auto deploy discovery and rollback
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python -m unittest discover -s infra/azure/tests -v

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          retention-days: 14

  no-docker-runtime:
    name: Build no-Docker Windows runtime bundle
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build executable Spring Boot JARs
        run: mvn -B clean package -DskipTests

      - name: Assemble and checksum runtime bundle
        shell: pwsh
        run: ./infra/no-docker/scripts/Build-RuntimeBundle.ps1 -SkipBackendBuild

      - name: Upload no-Docker runtime
        uses: actions/upload-artifact@v4
        with:
          name: social-media-no-docker-${{ github.sha }}
          path: dist/no-docker-runtime
          retention-days: 1

  cloudflare-workers-preview:
    name: Deploy Next.js preview to Cloudflare Workers
    needs: [nextjs-ui, build-and-test]
    if: github.ref == 'refs/heads/codex/ui-backend-integration' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://${{ vars.AZURE_BACKEND_HOST }}
      GATEWAY_UPSTREAM: https://${{ vars.AZURE_BACKEND_HOST }}
      NEXT_PUBLIC_WS_BASE_URL: https://${{ vars.AZURE_BACKEND_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate preview deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          let url;
          try { url = new URL(process.env.API_BASE_URL); }
          catch { throw new Error('Set AZURE_BACKEND_HOST to the public Azure VM hostname, without a scheme.'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash ||
              ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
            throw new Error('API_BASE_URL must be a public HTTPS origin without credentials, path or query.');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub settings.');
          }
          NODE

      - name: Install Next.js and Workers dependencies
        working-directory: frontend-web
        run: npm ci --no-audit --no-fund

      - name: Deploy Next.js preview Worker
        working-directory: frontend-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:deploy

  cloudflare-workers-production:
    name: Deploy Next.js production to Cloudflare Workers
    needs: [nextjs-ui, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://${{ vars.AZURE_BACKEND_HOST }}
      GATEWAY_UPSTREAM: https://${{ vars.AZURE_BACKEND_HOST }}
      NEXT_PUBLIC_WS_BASE_URL: https://${{ vars.AZURE_BACKEND_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Validate production deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          let url;
          try { url = new URL(process.env.API_BASE_URL); }
          catch { throw new Error('Set AZURE_BACKEND_HOST to the public Azure VM hostname, without a scheme.'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash ||
              ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
            throw new Error('API_BASE_URL must be a public HTTPS origin without credentials, path or query.');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub settings.');
          }
          NODE

      - name: Install Next.js and Workers dependencies
        working-directory: frontend-web
        run: npm ci --no-audit --no-fund

      - name: Deploy Next.js production Worker
        working-directory: frontend-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:deploy:production
